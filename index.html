
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Witch's Grimoire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
        }
        h1, h2, h3, .mystical-font {
            font-family: 'Cinzel', serif;
        }
        @keyframes drift {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }
        .magic-bg {
          background: linear-gradient(-45deg, #1e1b4b, #312e81, #4c1d95, #1e1b4b);
          background-size: 400% 400%;
          animation: drift 15s ease infinite;
        }
        .loading-shimmer {
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: .5; }
        }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
      }
    }
    </script>
</head>
<body>
    <div id="root">
        <div class="min-h-screen flex items-center justify-center bg-[#020617]">
            <div class="text-center">
                <h2 class="mystical-font text-2xl text-purple-400 loading-shimmer">Conjuring the Grimoire...</h2>
                <p class="text-slate-600 text-sm mt-2 italic">Gathering astral threads</p>
            </div>
        </div>
    </div>
    <!-- Entry point for the React application -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
